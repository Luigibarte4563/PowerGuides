<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101B2D" />
    <meta
      name="description"
      content="PowerGuide Dagupan - report and track power outages, floods and electrical hazards in Dagupan City."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PowerGuide Dagupan | Report &amp; Track Power Outages</title>
    <script>
      /*
       * Resolve the theme before first paint, otherwise a dark-mode reload shows
       * a white flash while React boots. Must stay in sync with the STORAGE_KEY
       * and the prefers-color-scheme fallback in src/context/ThemeContext.jsx.
       */
      (function () {
        try {
          var stored = localStorage.getItem('powerguide.theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1524' : '#F6F7F9');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
